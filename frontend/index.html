<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The product name: keep in step with src/lib/brand.ts, which the app reads -->
    <title>MySun — Automated liquidity vaults</title>
    <meta name="description" content="Markets move. Your range follows. Automated liquidity vaults for less manual LP management." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Geist, Geist Mono and Newsreader are self-hosted (src/styles/fonts.css, files in public/fonts/). Newsreader is the serif, for every title, at light with its italic, plus regular for vault names; the optical-size axis lets large titles take the display cut -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/newsreader-latin.woff2" />
    <!-- Switzer, for the figures (see src/index.css), is served from the Fontshare CDN -->
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
